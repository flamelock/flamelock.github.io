<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lazy money calc</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 20px auto;
        padding: 20px;
        background: #f5f5f5;
    }

    h1 {
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
    }

    input {
        width: 80px;
        padding: 5px;
        text-align: center;
    }

    .total {
        margin-top: 20px;
        font-size: 1.5em;
        font-weight: bold;
        text-align: center;
        background: white;
        padding: 15px;
        border: 2px solid #333;
    }

    .subtotal {
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>lazy money calc</h1>

<table>
    <thead>
        <tr>
            <th>Denomination</th>
            <th>Quantity</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody id="cashTable"></tbody>
</table>

<div class="total">
    Total: $<span id="grandTotal">0.00</span>
</div>

<script>
const denominations = [
    { label: "5c", value: 0.05 },
    { label: "10c", value: 0.10 },
    { label: "20c", value: 0.20 },
    { label: "50c", value: 0.50 },
    { label: "$1", value: 1 },
    { label: "$2", value: 2 },
    { label: "$5", value: 5 },
    { label: "$10", value: 10 },
    { label: "$20", value: 20 },
    { label: "$50", value: 50 },
    { label: "$100", value: 100 }
];

const tableBody = document.getElementById("cashTable");

denominations.forEach((item, index) => {
    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${item.label}</td>
        <td>
            <input
                type="number"
                min="0"
                placeholder="0"
                id="qty${index}"
                oninput="calculateTotal()"
                onfocus="this.select()"
            >
        </td>
        <td class="subtotal" id="subtotal${index}">$0.00</td>
    `;

    tableBody.appendChild(row);
});

function calculateTotal() {
    let grandTotal = 0;

    denominations.forEach((item, index) => {
        const qty = Number(document.getElementById(`qty${index}`).value) || 0;
        const subtotal = qty * item.value;

        document.getElementById(`subtotal${index}`).textContent =
            `$${subtotal.toFixed(2)}`;

        grandTotal += subtotal;
    });

    document.getElementById("grandTotal").textContent =
        grandTotal.toFixed(2);
}

calculateTotal();
</script>

</body>
</html>
